telegram:
  accounts:
    default:
      token: ${TELEGRAM_BOT_TOKEN}
    # Optional dedicated bot account for agents/timur_agent.
    # Uncomment only when TELEGRAM_TIMUR_AGENT_BOT_TOKEN is set; otherwise keep
    # the account absent so the lab agent cannot steal default Telegram traffic.
    # timur_agent_lab:
    #   token: ${TELEGRAM_TIMUR_AGENT_BOT_TOKEN}

# whatsapp:
#   accounts:
#     default:
#       auth_dir: ./data/wa-auth/default

defaults:
  model: claude-sonnet-4-6
  embedding_provider: openai
  embedding_model: text-embedding-3-small
  debounce_ms: 1500

runtime:
  headless:
    # Default Runtime v1 provider. Roll back by setting this to
    # claude-agent-sdk or by restoring the previous config.yml.
    provider: pi

