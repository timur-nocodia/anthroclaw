model: claude-sonnet-4-6
timezone: Asia/Almaty

safety_profile: chat_like_openclaw

routes:
  - channel: telegram
    scope: dm
    peers: [ "48705953" ]

pairing:
  mode: off

allowlist:
  telegram: [ "48705953" ]

mcp_tools:
  - memory_search
  - memory_write
  - list_skills

mcp_onboarding:
  enabled: false

queue_mode: steer

iteration_budget:
  max_tool_calls: 12
  timeout_ms: 90000
  grace_message: true

auto_compress:
  enabled: true
  threshold_messages: 20

learning:
  enabled: true
  mode: propose
  review_interval_turns: 10
  skill_review_min_tool_calls: 8
