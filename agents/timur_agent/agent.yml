model: claude-sonnet-4-6
timezone: Asia/Almaty
time_prefix_format: human-ru

runtime:
  headless:
    provider: pi

safety_profile: private

routes:
  - channel: telegram
    scope: dm
    peers: [ "48705953" ]

pairing:
  mode: off

allowlist:
  telegram: [ "48705953" ]

mcp_tools:
  - memory_search
  - memory_write
  - memory_wiki
  - session_search
  - local_note_search
  - local_note_propose
  - send_message
  - send_media
  - web_search_brave
  - web_search_exa
  - access_control
  - list_skills
  - manage_skills
  - manage_cron
  - manage_notifications
  - manage_human_takeover
  - manage_operator_console
  - show_config
  - escalate
  - buildroom_submit_signal
  - buildroom_submit_session_summary

mcp_onboarding:
  enabled: true

queue_mode: steer
group_sessions: per_user
session_policy: daily
maxSessions: 200

thinking:
  type: adaptive
effort: high

iteration_budget:
  max_tool_calls: 100
  timeout_ms: 300000
  absolute_timeout_ms: 1200000
  grace_message: true

auto_compress:
  enabled: true
  threshold_messages: 20

memory_extraction:
  enabled: true
  max_candidates: 8
  max_input_chars: 12000
  min_confidence: 0.55
  require_review: false

learning:
  enabled: true
  mode: propose
  review_interval_turns: 5
  skill_review_min_tool_calls: 5
  max_actions_per_review: 10
  max_input_chars: 48000
  artifacts:
    max_files: 64
    max_file_bytes: 131072
    max_total_bytes: 524288
    max_prompt_chars: 48000
    max_snippet_chars: 8000
  approvals:
    admin:
      notify: true
      routes:
        - channel: telegram
          account_id: default
          peer_id: "48705953"
      senders:
        telegram:
          default: [ "48705953" ]
      notify_admin_for:
        - learning_memory
        - learning_skill
        - curator_action
        - tool_approval

heartbeat:
  enabled: false
  every: 1h
  target: last
  isolated_session: true
  show_ok: false

human_takeover:
  enabled: true
  pause_ttl_minutes: 30
  channels: [ "telegram" ]
  ignore: [ "reactions", "receipts", "typing", "protocol" ]
  notification_throttle_minutes: 5

notifications:
  enabled: true
  routes:
    operator:
      channel: telegram
      account_id: default
      peer_id: "48705953"
  subscriptions:
    - event: agent_error
      route: operator
      throttle: 5m
    - event: iteration_budget_exhausted
      route: operator
      throttle: 5m
    - event: escalation_needed
      route: operator
      throttle: 1m

plugins:
  lcm:
    enabled: true
    triggers:
      compress_threshold_tokens: 24000
      fresh_tail_count: 40
      assembly_cap_tokens: 120000
      reserve_tokens_floor: 4096
    externalization:
      large_output:
        enabled: true
        threshold_chars: 12000
    operator:
      slash_command:
        enabled: true
      doctor:
        clean_apply:
          enabled: false
  operator-console:
    enabled: true
    manages: "*"
    capabilities:
      - peer_pause
      - delegate
      - list_peers
      - peer_summary
      - escalate
  file-transfer:
    enabled: true
    roots:
      - agents/timur_agent/lab-files
      - research
    allowWrite: true
    maxFileBytes: 1048576
    maxEntries: 200
  honcho:
    enabled: false
    mode: tools
    connection:
      workspace_id: anthroclaw-timur-agent-lab
      environment: local
      base_url: http://localhost:8000
      timeout_ms: 5000
      max_retries: 0

channel_context:
  reply_to_mode: always
  telegram:
    peers:
      "48705953":
        prompt: "Private operator DM with Timur. Prefer concise Russian, keep actions explicit, and ask before irreversible side effects."
        reply_to_mode: always

display:
  toolProgress: all
  toolPreviewLength: 120
  cleanupProgress: true
  subagentTools: indented
  showReasoning: false
  streaming: true
  taskNotifications: true

quick_commands:
  help:
    command: "printf '%s\n' '/status - runtime and route status' '/scope - allowed and guarded actions' '/tools - enabled tool groups' '/memory - memory and session context' '/learning - propose-only learning state' '/plugins - plugin state' '/cron - cron state' '/mcp - MCP onboarding state' '/smoke - Pi runtime canary' '/handoff - operator handoff summary'"
    timeout: 10
  status:
    command: "printf '%s\n' 'timur_agent: ok' 'runtime: pi' 'scope: dedicated operator parity lab' 'learning: propose-only' 'route_account: default'"
    timeout: 10
  scope:
    command: "printf '%s\n' 'allowed: allowlisted Telegram DM with Timur' 'allowed: memory, session search, skills, messaging/media, cron, notifications, operator console, config, escalation, Buildroom, MCP onboarding, plugins' 'guarded: real side effects require explicit target confirmation' 'blocked: broad groups, customers, unknown peers, hardcoded secrets, fleet rollout claims'"
    timeout: 10
  tools:
    command: "printf '%s\n' 'memory' 'session search' 'skills' 'messaging/media' 'cron' 'notifications' 'human takeover' 'operator console' 'config' 'escalation' 'Buildroom' 'MCP onboarding' 'plugins'"
    timeout: 10
  memory:
    command: "printf '%s\n' 'memory: local durable notes and search are enabled' 'memory wiki: structured durable pages are enabled' 'session search: previous turns can be searched' 'LCM: enabled for long-context carryover' 'Honcho: configured but disabled until local service is available'"
    timeout: 10
  learning:
    command: "printf '%s\n' 'learning: propose-only' 'operator review required before applying learning actions'"
    timeout: 10
  plugins:
    command: "printf '%s\n' 'LCM: enabled' 'operator-console: enabled' 'file-transfer: enabled for configured roots' 'Honcho: configured, disabled until local service is available'"
    timeout: 10
  cron:
    command: "printf '%s\n' 'cron: timur-agent-lab-silent-check exists' 'cron: disabled by default' 'operator approval required before enabling live firing'"
    timeout: 10
  mcp:
    command: "printf '%s\n' 'MCP onboarding: enabled' 'external MCP servers: managed flow only' 'secrets: never hardcoded in chat or config'"
    timeout: 10
  handoff:
    command: "printf '%s\n' 'handoff: timur_agent operator parity lab' 'scope: allowlisted Telegram DM, route_account default' 'side effects: require explicit target confirmation' 'feature groups: memory, learning, plugins, cron, notifications, MCP onboarding, Buildroom' 'repeatable checks: pnpm runtime:pi-timur-agent-operator-smoke -- --json --allow-skip'"
    timeout: 10

cron:
  - id: timur-agent-lab-silent-check
    schedule: "*/15 * * * *"
    prompt: "Run a silent health check. If all is fine, respond exactly [SILENT]. If something is wrong, describe the problem briefly."
    deliver_to:
      channel: telegram
      account_id: default
      peer_id: "48705953"
    enabled: false
